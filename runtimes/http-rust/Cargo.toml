[package]
name = "sdk-http-runtime-rs"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "tono_http_runtime"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }

# Detach from the backend/cli workspace: this crate is a standalone runtime a
# generated Rust SDK depends on, same as the http-go module / http-ts package.
[workspace]
