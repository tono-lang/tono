version: 2
# Note: opam/OCaml is not supported by Dependabot; update OCaml deps manually.
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  # This npm tree is dev tooling (test runner, formatter), never shipped, but
  # it was invisible here: security updates run regardless of this file, so
  # advisories arrived while routine updates never did, and the gap between the
  # two is what let the toolchain fall a major behind.
  - package-ecosystem: npm
    directory: "/backend/codegen-tests/typescript"
    schedule:
      interval: weekly
