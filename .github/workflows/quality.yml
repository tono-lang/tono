name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  duplication:
    name: Duplication (jscpd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: jscpd (fail if duplication > 3%)
        # min-tokens 75 (~8-10 lines) ignores the small, unavoidable structural
        # overlap between the independent per-language codegen targets (their
        # Target impls, render-rule match arms, and primitive maps) while still
        # catching real copy-paste blocks; the shared logic itself lives in the
        # engine's conventions/test-support modules.
        run: >
          npx --yes jscpd .
          --threshold 3
          --min-tokens 75
          --reporters consoleFull
          --ignore "**/target/**,**/_build/**,**/node_modules/**,**/*.lock"

  file-size:
    name: File size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check file sizes
        run: bash scripts/check-file-size.sh

  internal-doc-refs:
    name: Internal doc references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Tree, every commit in the PR, branch name, PR title and body. The PR
      # fields go through env, never inline, so their text is data to the
      # shell rather than script.
      - name: Check for internal doc references
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash scripts/check-internal-doc-refs.sh

  unused-deps:
    name: Unused deps (cargo-machete)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete

  typos:
    name: Typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@master
