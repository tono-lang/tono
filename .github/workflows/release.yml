name: Release

on:
  push:
    tags:
      - "v*"
  # A dry run: builds and packages all four platforms but publishes nothing,
  # so the matrix can be validated without burning a public tag.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ui:
    name: Build the playground UI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ocaml/setup-ocaml@15d660006c1d3110d77c34b7faa3bddefe8b82f0 # v3.7.0
        with:
          ocaml-compiler: "5.2"

      - name: Install the frontend's OCaml dependencies
        run: opam install yojson.3.0.0 js_of_ocaml.6.2.0 js_of_ocaml-ppx.6.2.0 lsp.1.25.0 jsonrpc.1.25.0 --yes

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install node dependencies
        # --ignore-scripts blocks dependency lifecycle scripts; vite's esbuild
        # resolves its platform binary via optional deps, and wasm-pack comes
        # from install-action below instead of its npm postinstall download.
        run: npm ci --ignore-scripts
        working-directory: playground

      - uses: taiki-e/install-action@ace6ebe54a6a0c86dfb5f7764b17f793b6925bc3 # v2
        with:
          tool: wasm-pack@0.13.1

      - name: Build the embedded compiler halves
        run: opam exec -- playground/scripts/build-compiler.sh

      - name: Build the web app
        # full mode: the CLI-embedded UI runs locally against the user's own
        # toolchains, so it gets the Run panel; the capped hosted mode (no
        # execution) is only for the static GitHub Pages demo.
        run: npm run build
        working-directory: playground
        env:
          VITE_PLAYGROUND_MODE: full

      # Built once here rather than per matrix leg: the bundle is the same
      # static JS/wasm regardless of the target platform the CLI ships for.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playground-dist
          path: playground/dist
          if-no-files-found: error

  build:
    name: Build (${{ matrix.target }})
    needs: build-ui
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Every leg runs on a runner whose own architecture matches the target.
        # OCaml has no cross-compiler, so a native runner per architecture is
        # the only way to produce tono-frontend and tono-lsp for all four.
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Compute the release version
        id: version
        shell: bash
        # A dry run has no tag to read a version from, so it builds as
        # 0.0.0-dev; nothing downstream publishes it.
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Stamp the crate version
        shell: bash
        run: |
          for f in backend/Cargo.toml cli/Cargo.toml; do
            sed -i.bak "s/^version = \"0.0.0\"/version = \"${{ steps.version.outputs.version }}\"/" "$f"
            rm -f "$f.bak"
          done

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.target }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: playground-dist
          path: playground/dist

      - name: Build the tono binary
        # No Cargo.lock is committed, so the lockfile is generated once here
        # and then --locked keeps this build from silently re-resolving to a
        # newer dependency version mid-run. embed-ui bakes in the playground
        # UI built above, so the shipped binary needs no separate asset.
        run: |
          cargo generate-lockfile
          cargo build --release --locked --target ${{ matrix.target }} -p tono-cli --features embed-ui

      - uses: ocaml/setup-ocaml@15d660006c1d3110d77c34b7faa3bddefe8b82f0 # v3.7.0
        with:
          ocaml-compiler: "5.2"

      # Both OCaml binaries ship: tono shells out to tono-frontend for
      # parse/typecheck, and tono-lsp is the standalone stdio language server
      # editors launch.
      - name: Build the OCaml binaries
        run: |
          opam install yojson lsp jsonrpc --yes
          opam exec -- dune build frontend/bin/tono_frontend.exe lsp/tono_lsp.exe

      - name: Package the release archive
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          target="${{ matrix.target }}"
          stage="tono-${version}-${target}"
          mkdir -p "$stage"
          cp "target/${target}/release/tono" "$stage/tono"
          cp "_build/default/frontend/bin/tono_frontend.exe" "$stage/tono-frontend"
          cp "_build/default/lsp/tono_lsp.exe" "$stage/tono-lsp"
          # dune leaves its build artefacts read-only (555) and tar preserves
          # the mode, so an archive member would land read-only on the user's
          # machine and refuse to be replaced by the next upgrade. Stamped
          # writable here so the shipped mode never depends on how a build
          # tool happened to leave its output.
          chmod 755 "$stage/tono" "$stage/tono-frontend" "$stage/tono-lsp"
          cp README.md LICENSE "$stage/"
          tar czf "${stage}.tar.gz" "$stage"
          shasum -a 256 "${stage}.tar.gz" > "${stage}.tar.gz.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: |
            tono-*.tar.gz
            tono-*.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    # Publishing only ever happens for a tag; a dry run stops after build.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Combine per-platform checksums into one file
        working-directory: dist
        run: cat ./*.sha256 > SHA256SUMS

      # Trait names read as user mentions once a PR title lands in the notes:
      # "@doc" and "@deprecated" credited two unrelated GitHub accounts as
      # contributors on the first release, and notified them. Every trait in
      # the language starts with @, so the generated notes are escaped here
      # rather than relying on PR titles avoiding them. The generator's own
      # "by @user" credits are real and stay untouched.
      - name: Generate release notes with trait mentions escaped
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${GITHUB_REF_NAME}" --jq .body \
            | perl -pe 's/(?<!by )\@([a-zA-Z][a-zA-Z0-9_-]*)/`\@$1`/g' > notes.md

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          body_path: notes.md
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS

  homebrew:
    name: Update the Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # The default GITHUB_TOKEN cannot write to another repository, so the tap
      # push authenticates with a deploy key. A deploy key belongs to the tap
      # repo itself rather than to a person: it cannot reach any other
      # repository, and the automation does not break when someone rotates a
      # token or leaves the org.
      - name: Authenticate to the tap with its deploy key
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts

      # A multi-platform formula needs 4 independent url/sha256 pairs (macOS
      # arm64/x86_64, Linux x86_64/arm64), which is more than the standard
      # bump-formula actions (built for a single download URL) model, so the
      # formula is rendered here and pushed straight to the tap.
      - name: Render and push the formula
        working-directory: dist
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          sha() { cut -d' ' -f1 "tono-${version}-$1.tar.gz.sha256"; }

          cat > tono.rb <<EOF
          class Tono < Formula
            desc "Tono language compiler: generate idiomatic SDKs from a single source"
            homepage "https://github.com/tono-lang/tono"
            version "${version}"
            license "Apache-2.0"

            on_macos do
              on_arm do
                url "https://github.com/tono-lang/tono/releases/download/${GITHUB_REF_NAME}/tono-${version}-aarch64-apple-darwin.tar.gz"
                sha256 "$(sha aarch64-apple-darwin)"
              end
              on_intel do
                url "https://github.com/tono-lang/tono/releases/download/${GITHUB_REF_NAME}/tono-${version}-x86_64-apple-darwin.tar.gz"
                sha256 "$(sha x86_64-apple-darwin)"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/tono-lang/tono/releases/download/${GITHUB_REF_NAME}/tono-${version}-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "$(sha aarch64-unknown-linux-gnu)"
              end
              on_intel do
                url "https://github.com/tono-lang/tono/releases/download/${GITHUB_REF_NAME}/tono-${version}-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "$(sha x86_64-unknown-linux-gnu)"
              end
            end

            def install
              bin.install "tono"
              bin.install "tono-frontend"
              bin.install "tono-lsp"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/tono version")
            end
          end
          EOF

          git clone git@github.com:tono-lang/homebrew-tono.git tap
          cp tono.rb tap/Formula/tono.rb
          cd tap
          git config user.name "tono-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add Formula/tono.rb
          git commit -m "tono ${GITHUB_REF_NAME}"
          git push
