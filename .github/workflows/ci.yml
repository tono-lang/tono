name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy (warnings = errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Test + coverage (lines >= 95%)
        run: cargo llvm-cov --workspace --fail-under-lines 95 --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rust-lcov
          path: lcov.info
          if-no-files-found: ignore

  ocaml:
    name: OCaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ocaml/setup-ocaml@15d660006c1d3110d77c34b7faa3bddefe8b82f0 # v3.7.0
        with:
          ocaml-compiler: "5.2"
      - name: Install tooling and frontend dependencies
        run: opam install ocamlformat bisect_ppx yojson alcotest qcheck-core lsp jsonrpc --yes
      - name: Format check
        run: opam exec -- dune build @fmt
      - name: Build (warnings = errors)
        run: opam exec -- dune build
      - name: Test
        run: opam exec -- dune runtest
      - name: Coverage (lines >= 95%)
        run: |
          opam exec -- dune runtest --instrument-with bisect_ppx --force
          opam exec -- bisect-ppx-report summary | tee coverage.txt
          pct=$(grep -oE '[0-9]+(\.[0-9]+)?%' coverage.txt | head -1 | tr -d '%')
          echo "OCaml line coverage: ${pct:-0}%"
          awk -v p="${pct:-0}" 'BEGIN { exit (p+0 >= 95) ? 0 : 1 }' \
            || { echo "::error::OCaml coverage ${pct:-0}% is below 95%"; exit 1; }

  typescript:
    name: TypeScript codegen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install the TypeScript toolchain
        run: npm ci --ignore-scripts
        working-directory: backend/codegen-tests/typescript
      - name: Generate, compile, and round-trip the emitted TypeScript
        run: cargo test --test typescript_roundtrip
      - name: Property-check the printed syntax against prettier
        run: cargo test --test property_render typescript_printer

  rust-codegen:
    name: Rust codegen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Generate, compile, and round-trip the emitted Rust
        run: cargo test --test rust_roundtrip
      - name: Property-check the printed syntax against rustfmt
        run: cargo test --test property_render rust_printer

  go-codegen:
    name: Go codegen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.21"
      - name: Generate, compile, and round-trip the emitted Go
        run: cargo test --test go_roundtrip
      - name: Property-check the printed syntax against gofmt
        run: cargo test --test property_render go_printer

  conformance:
    name: Cross-language conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.21"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install the TypeScript toolchain
        run: npm ci --ignore-scripts
        working-directory: backend/codegen-tests/typescript
      - name: Check that all three targets agree on the wire
        run: cargo test --test conformance

  e2e:
    name: End-to-end example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ocaml/setup-ocaml@15d660006c1d3110d77c34b7faa3bddefe8b82f0 # v3.7.0
        with:
          ocaml-compiler: "5.2"
      - name: Install the frontend's OCaml dependencies
        run: opam install yojson --yes
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.21"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install the TypeScript toolchain (prettier, tsc)
        run: npm ci --ignore-scripts
        working-directory: backend/codegen-tests/typescript
      - name: Install the HTTP runtime's toolchain (vitest, for the generated tests)
        run: npm ci --ignore-scripts
        working-directory: runtimes/http-ts
      - name: Regenerate the example end to end
        run: scripts/regen-example.sh
      - name: Verify the committed example is up to date
        run: |
          if ! git diff --quiet -- examples/; then
            git diff -- examples/
            echo "::error::examples/ is stale; run scripts/regen-example.sh and commit the result"
            exit 1
          fi
      - name: Verify the generated SDKs compile
        run: scripts/check-example-compiles.sh
      # The strong bespoke gate for `ext impl`: the tests declared in the spec
      # run as generated native suites through the Go and TypeScript clients,
      # hermetic against their stubs and live against the in-repo stores.
      - name: Verify the bespoke implementations conform
        run: scripts/check-impl-conformance.sh

  mutation:
    name: Mutation (bespoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The full history is needed to diff against the merge base on PRs.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: taiki-e/install-action@ace6ebe54a6a0c86dfb5f7764b17f793b6925bc3 # v2
        with:
          tool: cargo-mutants
      # Scope and hermetic test set come from .cargo/mutants.toml. A surviving
      # mutant in the hand-written seam exits non-zero and fails the build.
      # PRs mutate only the lines the diff touches (the triple-dot diff excludes
      # lines that changed only on the base branch); the full sweep runs on
      # every push to main, so unchanged code is still covered there.
      - name: Mutate the bespoke seam (a live mutant fails the build)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff "origin/${{ github.base_ref }}"...HEAD > /tmp/pr.diff
            cargo mutants --jobs 4 --in-diff /tmp/pr.diff
          else
            cargo mutants --jobs 4
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutants-report
          path: mutants.out
          if-no-files-found: ignore

  runtime-ts:
    name: TypeScript runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # --ignore-scripts blocks dependency lifecycle scripts; vitest and Stryker
      # resolve their platform binaries via optional deps, so none need to run.
      - name: Install the runtime's toolchain
        run: npm ci --ignore-scripts
        working-directory: runtimes/http-ts
      - name: Test
        run: npm test
        working-directory: runtimes/http-ts
      # The runtime is hand-written (bespoke), so it carries the strong mutation
      # gate too: a surviving mutant exits non-zero and fails the build.
      - name: Mutation (a live mutant fails the build)
        run: npm run mutation
        working-directory: runtimes/http-ts
      # The parity gate: scripts/run-parity.sh compiles runtimes/parity/spec.tono,
      # generates the real TypeScript SDK, and drives it directly, so this needs
      # both compiler halves rather than just the runtime package above.
      - uses: ocaml/setup-ocaml@15d660006c1d3110d77c34b7faa3bddefe8b82f0 # v3.7.0
        with:
          ocaml-compiler: "5.2"
      - name: Install the frontend's OCaml dependencies
        run: opam install yojson --yes
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Parity vectors against the generated SDK
        run: scripts/run-parity.sh typescript

  runtime-go:
    name: Go runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.22"
      # TONO_PARITY_VECTORS makes the cross-runtime parity suite mandatory
      # here: without it the test skips when the file is out of reach (as it
      # is inside the mutation tool's module-only sandbox).
      - name: Test
        run: go test ./...
        working-directory: runtimes/http-go
        env:
          TONO_PARITY_VECTORS: ${{ github.workspace }}/runtimes/parity/vectors.json
      # The runtime is hand-written (bespoke), so it carries the strong mutation
      # gate too: a lived mutant exits non-zero and fails the build. Scope and
      # thresholds come from runtimes/http-go/.gremlins.yaml.
      - name: Mutation (a live mutant fails the build)
        uses: go-gremlins/gremlins-action@9dc8e981be89dbf79258cdd1400c54e762c770fe # v1.0.3
        with:
          version: v0.6.0
          workdir: runtimes/http-go
      # The parity gate: scripts/run-parity.sh compiles runtimes/parity/spec.tono,
      # generates the real Go SDK, and drives it directly, so this needs both
      # compiler halves rather than just the runtime package above.
      - uses: ocaml/setup-ocaml@15d660006c1d3110d77c34b7faa3bddefe8b82f0 # v3.7.0
        with:
          ocaml-compiler: "5.2"
      - name: Install the frontend's OCaml dependencies
        run: opam install yojson --yes
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Parity vectors against the generated SDK
        run: scripts/run-parity.sh go

  runtime-rust:
    name: Rust runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: runtimes/http-rust
      - name: Format
        run: cargo fmt --check
        working-directory: runtimes/http-rust
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: runtimes/http-rust
      # TONO_PARITY_VECTORS makes the cross-runtime parity suite mandatory
      # here: without it the test skips when the file is out of reach (as it
      # is inside the mutation tool's crate-only sandbox).
      - name: Test
        run: cargo test
        working-directory: runtimes/http-rust
        env:
          TONO_PARITY_VECTORS: ${{ github.workspace }}/runtimes/parity/vectors.json
      - uses: taiki-e/install-action@ace6ebe54a6a0c86dfb5f7764b17f793b6925bc3 # v2
        with:
          tool: cargo-mutants
      # The runtime is hand-written (bespoke), so it carries the strong mutation
      # gate too: a surviving mutant exits non-zero and fails the build. Scope
      # comes from runtimes/http-rust/.cargo/mutants.toml.
      - name: Mutation (a live mutant fails the build)
        run: cargo mutants --jobs 4
        working-directory: runtimes/http-rust
      # The parity gate: scripts/run-parity.sh compiles runtimes/parity/spec.tono,
      # generates the real Rust SDK, and runs the harness as a test module of
      # the generated crate itself, so this needs both compiler halves rather
      # than just the runtime package above.
      - uses: ocaml/setup-ocaml@15d660006c1d3110d77c34b7faa3bddefe8b82f0 # v3.7.0
        with:
          ocaml-compiler: "5.2"
      - name: Install the frontend's OCaml dependencies
        run: opam install yojson --yes
      - name: Parity vectors against the generated SDK
        run: scripts/run-parity.sh rust

  # Single aggregating check - this is the one to mark "required" in branch protection.
  ci-success:
    name: CI success
    runs-on: ubuntu-latest
    needs: [rust, ocaml, typescript, rust-codegen, go-codegen, conformance, e2e, mutation, runtime-ts, runtime-go, runtime-rust]
    if: always()
    steps:
      - name: Verify required jobs
        run: |
          if [ "${{ needs.rust.result }}" != "success" ] \
            || [ "${{ needs.ocaml.result }}" != "success" ] \
            || [ "${{ needs.typescript.result }}" != "success" ] \
            || [ "${{ needs.rust-codegen.result }}" != "success" ] \
            || [ "${{ needs.go-codegen.result }}" != "success" ] \
            || [ "${{ needs.conformance.result }}" != "success" ] \
            || [ "${{ needs.e2e.result }}" != "success" ] \
            || [ "${{ needs.mutation.result }}" != "success" ] \
            || [ "${{ needs.runtime-ts.result }}" != "success" ] \
            || [ "${{ needs.runtime-go.result }}" != "success" ] \
            || [ "${{ needs.runtime-rust.result }}" != "success" ]; then
            echo "One or more required jobs failed."
            exit 1
          fi
          echo "All required jobs passed."

  playground:
    name: Playground web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ocaml/setup-ocaml@15d660006c1d3110d77c34b7faa3bddefe8b82f0 # v3.7.0
        with:
          ocaml-compiler: "5.2"
      - name: Install the frontend's OCaml dependencies
        run: opam install yojson.3.0.0 js_of_ocaml.6.2.0 js_of_ocaml-ppx.6.2.0 lsp.1.25.0 jsonrpc.1.25.0 --yes
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install node dependencies
        # --ignore-scripts blocks dependency lifecycle scripts; vite's esbuild
        # resolves its platform binary via optional deps, and wasm-pack comes
        # from install-action below instead of its npm postinstall download.
        run: npm ci --ignore-scripts
        working-directory: playground
      - uses: taiki-e/install-action@ace6ebe54a6a0c86dfb5f7764b17f793b6925bc3 # v2
        with:
          tool: wasm-pack@0.13.1
      - name: Build the embedded compiler halves
        run: opam exec -- playground/scripts/build-compiler.sh
      - name: Unit tests
        run: npm test
        working-directory: playground
      - name: Smoke over the built artifacts
        run: node scripts/smoke.mjs
        working-directory: playground
      - name: Type-check and build the app
        run: npm run build
        working-directory: playground
      - name: Build the CLI with the playground server
        run: cargo build --locked -p tono-cli --features embed-ui
