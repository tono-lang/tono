name: Sonar

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sonarqube:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Note when token is absent
        if: env.SONAR_TOKEN == ''
        run: echo "SONAR_TOKEN secret not set; skipping analysis until the Sonar account is connected."
      - uses: actions/checkout@v7
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        if: env.SONAR_TOKEN != ''
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        if: env.SONAR_TOKEN != ''
      - uses: taiki-e/install-action@ace6ebe54a6a0c86dfb5f7764b17f793b6925bc3 # v2
        if: env.SONAR_TOKEN != ''
        with:
          tool: cargo-llvm-cov
      # The CLI tooling tests shell out to the OCaml frontend and the Go
      # toolchain; without them those tests skip and the cli crate's coverage
      # collapses.
      - uses: ocaml/setup-ocaml@15d660006c1d3110d77c34b7faa3bddefe8b82f0 # v3.7.0
        if: env.SONAR_TOKEN != ''
        with:
          ocaml-compiler: "5.2"
      - name: Build the OCaml frontend for the CLI tooling tests
        if: env.SONAR_TOKEN != ''
        run: |
          opam install yojson lsp jsonrpc --yes
          opam exec -- dune build frontend/bin/tono_frontend.exe
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: env.SONAR_TOKEN != ''
        with:
          go-version: "1.21"
      - name: Generate Rust coverage for Sonar
        if: env.SONAR_TOKEN != ''
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - uses: actions/setup-node@v7
        if: env.SONAR_TOKEN != ''
        with:
          node-version: 20
      - uses: taiki-e/install-action@ace6ebe54a6a0c86dfb5f7764b17f793b6925bc3 # v2
        if: env.SONAR_TOKEN != ''
        with:
          tool: tree-sitter-cli@0.26.8
      # The highlighter tests load the real tree-sitter-tono grammar; the rest
      # of build-compiler.sh (the OCaml frontend, the Rust wasm backend) isn't
      # needed for coverage and would slow this job down for no benefit here.
      - name: Build the tono grammar for the highlighter tests
        if: env.SONAR_TOKEN != ''
        run: playground/scripts/build-tono-grammar.sh
      - name: Generate playground coverage for Sonar
        if: env.SONAR_TOKEN != ''
        working-directory: playground
        run: npm ci --ignore-scripts && npx --no-install vitest run --coverage.enabled --coverage.reporter=lcov
      - name: Rebase playground lcov paths to the repo root
        if: env.SONAR_TOKEN != ''
        run: sed -i 's#^SF:src/#SF:playground/src/#' playground/coverage/lcov.info
      - name: SonarQube Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
