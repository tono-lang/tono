name: Sonar

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sonarqube:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Note when token is absent
        if: env.SONAR_TOKEN == ''
        run: echo "SONAR_TOKEN secret not set; skipping analysis until the Sonar account is connected."
      - uses: actions/checkout@v7
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        if: env.SONAR_TOKEN != ''
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        if: env.SONAR_TOKEN != ''
      - uses: taiki-e/install-action@ace6ebe54a6a0c86dfb5f7764b17f793b6925bc3 # v2
        if: env.SONAR_TOKEN != ''
        with:
          tool: cargo-llvm-cov
      # The CLI tooling tests shell out to the OCaml frontend and the Go
      # toolchain; without them those tests skip and the cli crate's coverage
      # collapses.
      - uses: ocaml/setup-ocaml@15d660006c1d3110d77c34b7faa3bddefe8b82f0 # v3.7.0
        if: env.SONAR_TOKEN != ''
        with:
          ocaml-compiler: "5.2"
      - name: Build the OCaml frontend for the CLI tooling tests
        if: env.SONAR_TOKEN != ''
        run: |
          opam install yojson lsp jsonrpc --yes
          opam exec -- dune build frontend/bin/tono_frontend.exe
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: env.SONAR_TOKEN != ''
        with:
          go-version: "1.21"
      - name: Generate Rust coverage for Sonar
        if: env.SONAR_TOKEN != ''
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - uses: actions/setup-node@v7
        if: env.SONAR_TOKEN != ''
        with:
          node-version: 20
      - name: Generate TypeScript runtime coverage for Sonar
        if: env.SONAR_TOKEN != ''
        working-directory: runtimes/http-ts
        # --ignore-scripts blocks dependency lifecycle scripts; vitest and its
        # esbuild backend resolve their platform binaries via optional deps, so
        # no install script needs to run.
        run: npm ci --ignore-scripts && npm test
      - name: Rebase runtime lcov paths to the repo root
        if: env.SONAR_TOKEN != ''
        # vitest writes SF paths relative to the package; Sonar resolves them from
        # the repo root, so prefix them with the package path.
        run: sed -i 's#^SF:src/#SF:runtimes/http-ts/src/#' runtimes/http-ts/coverage/lcov.info
      - name: Generate Go runtime coverage for Sonar
        if: env.SONAR_TOKEN != ''
        working-directory: runtimes/http-go
        run: go test -coverprofile=coverage.out ./...
        env:
          TONO_PARITY_VECTORS: ${{ github.workspace }}/runtimes/parity/vectors.json
      - name: Rebase Go coverage paths to the repo root
        if: env.SONAR_TOKEN != ''
        # go test writes module-path-prefixed file names; Sonar resolves them
        # from the repo root, so swap the module prefix for the package path.
        run: sed -i 's#github.com/tono-lang/tono/runtimes/http-go/#runtimes/http-go/#' runtimes/http-go/coverage.out
      - name: Generate Rust runtime coverage for Sonar
        if: env.SONAR_TOKEN != ''
        working-directory: runtimes/http-rust
        # A detached workspace (like http-go/http-ts), so it gets its own
        # cargo-llvm-cov run rather than folding into the root --workspace one.
        run: cargo llvm-cov --lcov --output-path lcov.info
        env:
          TONO_PARITY_VECTORS: ${{ github.workspace }}/runtimes/parity/vectors.json
      - name: Rebase Rust runtime lcov paths to the repo root
        if: env.SONAR_TOKEN != ''
        # cargo llvm-cov (run outside --workspace mode) writes SF as the
        # absolute build path; Sonar resolves paths from the repo root, so
        # strip everything up to and including the crate directory.
        run: sed -i 's#^SF:.*/runtimes/http-rust/#SF:runtimes/http-rust/#' runtimes/http-rust/lcov.info
      - name: SonarQube Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
