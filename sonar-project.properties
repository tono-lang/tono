# SonarQube Cloud configuration.
# Fill organization/projectKey from the Sonar UI after connecting the repo,
# then add a SONAR_TOKEN secret to the repo/org for the Sonar workflow to run.
sonar.organization=tono-lang
sonar.projectKey=tono-lang_tono
sonar.host.url=https://sonarcloud.io

sonar.sources=.
# OCaml is not analyzed by Sonar; exclude only the OCaml trees and build output.
sonar.exclusions=**/target/**,**/_build/**,**/node_modules/**,frontend/**,lsp/**

# Rust coverage import: the Sonar job runs cargo-llvm-cov to produce lcov.info.
sonar.rust.lcov.reportPaths=lcov.info

# Coverage is enforced per language by its own tooling: Rust via cargo-llvm-cov
# (imported above), the hand-written TypeScript runtime via vitest, and the
# generated example SDKs via the drift guard and the compile check. Sonar only
# ingests the Rust report, so keep the code it cannot measure out of the coverage
# gate (it is still scanned for issues).
sonar.coverage.exclusions=examples/**,runtimes/**
