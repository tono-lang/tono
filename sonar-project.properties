# SonarQube Cloud configuration.
# Fill organization/projectKey from the Sonar UI after connecting the repo,
# then add a SONAR_TOKEN secret to the repo/org for the Sonar workflow to run.
sonar.organization=tono-lang
sonar.projectKey=tono-lang_tono
sonar.host.url=https://sonarcloud.io

sonar.sources=.
# OCaml is not analyzed by Sonar; exclude only the OCaml trees and build output.
sonar.exclusions=**/target/**,**/_build/**,**/node_modules/**,frontend/**,lsp/**

# Coverage import: Rust from cargo-llvm-cov, the hand-written TypeScript
# runtime from vitest, and the hand-written Go runtime from go test (all
# produced by the Sonar job). The runtimes' source is measured, not excluded.
sonar.rust.lcov.reportPaths=lcov.info
sonar.javascript.lcov.reportPaths=runtimes/http-ts/coverage/lcov.info
sonar.go.coverage.reportPaths=runtimes/http-go/coverage.out

# Kept out of the coverage metric only: generated SDKs (verified by the drift
# guard and the compile check, not unit tested), test files, and build config.
sonar.coverage.exclusions=examples/**,**/*.test.ts,**/*.config.ts,**/*_test.go

# Copy-paste detection sensitivity for the Rust engine, aligned with the jscpd
# gate (quality.yml, --min-tokens 75). The five independent per-language codegen
# targets are structural mirrors of each other by design: each renders the same
# IR through its own syntax, so their per-field emitters share a shape while
# every token (the target's keywords, casing, and operators) differs. That
# inherent parallelism is not copy-paste to consolidate (coupling the targets is
# forbidden), so Sonar's block detector is tuned above the mirror size while
# jscpd stays the primary guard against real duplication. This is a sensitivity
# threshold, not a file exclusion.
sonar.cpd.rust.minimumTokens=700
