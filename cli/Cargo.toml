[package]
name = "tono-cli"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "tono"
path = "src/main.rs"

[features]
# The interactive preview UI. On by default so `tono preview` just works; opt out
# (`--no-default-features`) for a lean binary that keeps `tono preview --once` (the
# render-and-check pass) but drops the terminal UI and its dependency stack.
default = ["preview", "playground"]
# The local web playground server. embed-ui additionally compiles the built web
# assets into the binary (requires playground/dist to exist) and is what every
# shipped release builds with; without it the command falls back to a dev
# checkout's playground/dist (cargo run -- playground), so plain cargo builds
# never depend on node.
playground = ["dep:tiny_http", "dep:rust-embed"]
embed-ui = ["playground", "dep:rust-embed"]
preview = [
    "dep:ratatui",
    "dep:tree-sitter",
    "dep:tree-sitter-highlight",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-go",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-tono",
]

[dependencies]
tono-backend = { path = "../backend" }
# The playground's local HTTP server: synchronous and dependency-light, matching
# the CLI's thread-per-task style.
tiny_http = { version = "0.12", optional = true }
rust-embed = { version = "8", optional = true, features = ["include-exclude"] }
# Merging the generated TypeScript package manifest into whatever is already on
# disk, so generation owns `exports` without discarding the rest of the file.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The preview's terminal UI, behind the `preview` feature. crossterm is used
# through ratatui's re-export (`ratatui::crossterm`) so the two never drift.
ratatui = { version = "0.30", optional = true }
# Syntax highlighting for the preview panes: the tono grammar for the source pane
# and the official grammars of the generated languages (the TypeScript queries
# extend the JavaScript ones, hence both). tree-sitter-tono is not on crates.io,
# so it is pinned to a rev; bump deliberately when the grammar evolves.
tree-sitter-highlight = { version = "0.26.11", optional = true }
tree-sitter-rust = { version = "0.24.2", optional = true }
tree-sitter-go = { version = "0.25.0", optional = true }
tree-sitter-typescript = { version = "0.23.2", optional = true }
tree-sitter-javascript = { version = "0.25.0", optional = true }
tree-sitter = { version = "0.26.11", optional = true }
tree-sitter-tono = { git = "https://github.com/tono-lang/tree-sitter-tono", rev = "5b3242cdef4c03fb515acd78de2aa58166023160", version = "0.1.0", optional = true }
